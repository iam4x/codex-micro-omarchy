[package]
name = "codex-micro-omarchy"
version = "0.1.0"
edition = "2024"
description = "Native Codex Micro action editor for Omarchy"
license = "MIT"

[[bin]]
name = "codex-micro"
path = "src/main.rs"

[[example]]
name = "verify-native"
path = "examples/verify_native/main.rs"

[dependencies]
anyhow = "1"
fs2 = "0.4"
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }
gpui-component = "=0.5.1"
hidapi = { version = "2.6", default-features = false, features = ["linux-native"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
smol = "2"
tempfile = "3"
toml = "0.8"

[patch.crates-io]
stacksafe-macro = { path = "vendor/stacksafe-macro" }

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
